name: Deployment Prep

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: deployment-prep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --config.engine-strict=false

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
